<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - Fundación Levántate Mujer</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    console.log("[Instrument] 1. Después de cargar el widget. APIUrl interno:", window.netlifyIdentity && window.netlifyIdentity.gotrue ? window.netlifyIdentity.gotrue.api.apiURL : "Indefinido/Sin GoTrue");

    // Interceptar fetch para cazar quién llama a /settings
    const originalFetch = window.fetch;
    window.fetch = function() {
      if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('/settings')) {
        console.log("[Instrument] 3. FETCH DETECTADO a:", arguments[0]);
        console.trace("[Instrument] Traza de ejecución para el fetch a /settings:");
      }
      return originalFetch.apply(this, arguments);
    };

    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: "https://levantatemuejr.netlify.app/.netlify/identity"
      });
      console.log("[Instrument] 2. Después de ejecutar init() manual. APIUrl interno:", window.netlifyIdentity.gotrue ? window.netlifyIdentity.gotrue.api.apiURL : "Indefinido");
    }

    window.addEventListener("load", () => {
      console.log("[Instrument] 4. Después de cargar window (Decap CMS listo). APIUrl interno:", window.netlifyIdentity && window.netlifyIdentity.gotrue ? window.netlifyIdentity.gotrue.api.apiURL : "Indefinido");
    });
  </script>
</head>
<body>
  <!-- Incluir el script de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Configuración de la Media Library personalizada para R2 a través de Vercel API -->
  <script>
    const R2MediaLibrary = {
      name: 'r2-media',
      init: ({ options, handleInsert }) => {
        return {
          show: () => {
            // Crear un input de tipo file oculto
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,application/pdf';
            input.style.display = 'none';
            
            input.onchange = (e) => {
              const file = e.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onloadend = async () => {
                const base64 = reader.result.split(",")[1];
                
                try {
                  // Mostrar indicador de carga (opcional, pero útil)
                  document.body.style.cursor = 'wait';
                  
                  const response = await fetch("/api/upload", {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                      file: base64,
                      name: file.name,
                      type: file.type
                    }),
                  });

                  if (!response.ok) {
                    throw new Error(`Error en la subida: ${response.statusText}`);
                  }

                  const data = await response.json();
                  
                  // Insertar la URL pública generada en el CMS
                  handleInsert(data.url);
                  
                } catch (error) {
                  console.error("Error subiendo archivo:", error);
                  alert("Hubo un error al subir el archivo.");
                } finally {
                  document.body.style.cursor = 'default';
                }
              };
              
              reader.readAsDataURL(file);
            };
            
            document.body.appendChild(input);
            input.click();
            document.body.removeChild(input);
          },
          enableStandalone: () => true,
        };
      }
    };

    CMS.registerMediaLibrary(R2MediaLibrary);
  </script>
</body>
</html>
