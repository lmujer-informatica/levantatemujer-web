# =========================
# NOTICIAS
# =========================

- name: "noticias"
  label: "Noticias"
  folder: "src/data/noticias"
  create: true
  slug: "{{slug}}"
  extension: "json"
  format: "json"
  identifier_field: "titulo"
  fields:
    - label: "Título"
      name: "titulo"
      widget: "string"
      required: true
    - label: "Fecha"
      name: "fecha"
      widget: "string"
      required: true
      hint: "Formato: dd - mm - aaaa"
    - label: "Resumen"
      name: "resumen"
      widget: "text"
      required: true
      hint: "Texto corto para las tarjetas del listado"
    - label: "Imagen principal"
      name: "imagen"
      widget: "image"
      required: true
    - label: "Imágenes secundarias"
      name: "imagenes"
      widget: "list"
      max: 2
      field:
        label: "Imagen"
        name: "imagen"
        widget: "image"
    - label: "Párrafos"
      name: "parrafos"
      widget: "list"
      min: 1
      field:
        label: "Párrafo"
        name: "parrafo"
        widget: "text"

