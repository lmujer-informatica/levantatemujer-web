backend:
    name: github
    repo: lmujer-informatica/levantatemujer-web
    branch: main
    base_url: https://levantatemujer-web.vercel.app
    auth_endpoint: /api/auth
    squash_merges: true
    commit_messages:
        create: 'Create {{collection}} "{{slug}}"'
        update: 'Update {{collection}} "{{slug}}"'
        delete: 'Delete {{collection}} "{{slug}}"'

media_folder: "public/uploads"
public_folder: "/uploads"

media_library:
    name: r2-media

collections:
    # =========================
    # PÁGINA DE INICIO
    # =========================
    - name: "inicio"
      label: "Página de Inicio"
      files:
          - label: "Contenido de Inicio"
            name: "inicio"
            file: "src/data/inicio.json"
            fields:
                # HERO
                - label: "Hero - Frases"
                  name: "heroFrases"
                  widget: "list"
                  field:
                      label: "Frase"
                      name: "frase"
                      widget: "string"

                - label: "Hero - Imagen"
                  name: "heroImagen"
                  widget: "image"

                # PROGRAMAS PRIORITARIOS (Imágenes de los cards)
                - label: "Programas Prioritarios - Imágenes de Cards"
                  name: "programas"
                  widget: "list"
                  fields:
                      - label: "Programa"
                        name: "nombre"
                        widget: "string"
                      - label: "Imagen"
                        name: "imagen"
                        widget: "image"

                # LÍNEA DE AYUDA (Imagen al lado derecho)
                - label: "Línea de Ayuda - Imagen"
                  name: "lineaAyuda"
                  widget: "object"
                  fields:
                      - label: "Imagen"
                        name: "imagen"
                        widget: "image"

    # =========================
    # PROGRAMA I
    # =========================
    - name: "programaI"
      label: "Página de Programa I"
      files:
          - label: "Contenido de Programa I"
            name: "contenidoProgramaI"
            file: "src/data/programaI.json"
            fields:
                - label: "Hero - Imagen"
                  name: "heroImagen"
                  widget: "image"

                - label: "Testimonios - Carrusel Superior (Celeste)"
                  name: "testimoniosSuperior"
                  widget: "list"
                  fields:
                      - { label: "Título del Testimonio", name: "titulo", widget: "string" }
                      - {
                            label: "Fecha",
                            name: "fecha",
                            widget: "date",
                            format: "YYYY-MM-DD",
                        }
                      - {
                            label: "Nombre del Testigo",
                            name: "autor",
                            widget: "string",
                        }
                      - {
                            label: "Cargo del Testigo",
                            name: "rol",
                            widget: "string",
                        }
                      - {
                            label: "Texto del Testimonio",
                            name: "texto",
                            widget: "text",
                        }
                      - {
                            label: "Foto del Testigo",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }

                - label: "Testimonios - Carrusel Inferior (Verde)"
                  name: "testimoniosInferior"
                  widget: "list"
                  fields:
                      - { label: "Título del Testimonio", name: "titulo", widget: "string" }
                      - {
                            label: "Fecha",
                            name: "fecha",
                            widget: "date",
                            format: "YYYY-MM-DD",
                        }
                      - {
                            label: "Nombre del Testigo",
                            name: "autor",
                            widget: "string",
                        }
                      - {
                            label: "Cargo del Testigo",
                            name: "rol",
                            widget: "string",
                        }
                      - {
                            label: "Texto del Testimonio",
                            name: "texto",
                            widget: "text",
                        }
                      - {
                            label: "Foto del Testigo",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }

    # =========================
    # NOTICIAS
    # =========================
    - name: "noticias"
      label: "Página de Noticias"
      files:
          - label: "Contenido de Noticias"
            name: "contenidoNoticias"
            file: "src/data/noticias.json"
            fields:
                - label: "Hero - Frases"
                  name: "heroFrases"
                  widget: "list"
                  field: { label: "Frase", name: "frase", widget: "string" }
                - label: "Nuestras Últimas Noticias"
                  name: "noticias"
                  widget: "list"
                  fields:
                      - { label: "Título", name: "titulo", widget: "string" }
                      - {
                            label: "Fecha",
                            name: "fecha",
                            widget: "date",
                            format: "YYYY-MM-DD",
                        }
                      - {
                            label: "Descripción",
                            name: "descripcion",
                            widget: "text",
                        }
                      - {
                            label: "Imagen",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }
                      - {
                            label: "Color del Tema",
                            name: "colorTema",
                            widget: "string",
                            default: "#2C8E9E",
                            required: false,
                        }

    # =========================
    # EVENTOS
    # =========================
    - name: "eventos"
      label: "Página de Eventos"
      files:
          - label: "Contenido de Eventos"
            name: "contenidoEventos"
            file: "src/data/eventos.json"
            fields:
                - label: "Hero - Frases"
                  name: "heroFrases"
                  widget: "list"
                  field: { label: "Frase", name: "frase", widget: "string" }
                - label: "Evento Destacado"
                  name: "eventoDestacado"
                  widget: "object"
                  fields:
                      - { label: "Título", name: "titulo", widget: "string" }
                      - {
                            label: "Fecha",
                            name: "fecha",
                            widget: "date",
                            format: "YYYY-MM-DD",
                        }
                      - { label: "Ciudad", name: "ciudad", widget: "string", required: false }
                      - {
                            label: "Descripción",
                            name: "descripcion",
                            widget: "text",
                        }
                      - { label: "Lugar", name: "lugar", widget: "string" }
                      - { label: "Hora", name: "hora", widget: "string" }
                      - {
                            label: "Imagen",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }
                      - label: "¿A quiénes va dirigido?"
                        name: "dirigidoA"
                        widget: "list"
                        field:
                            {
                                label: "Público",
                                name: "publico",
                                widget: "string",
                            }
                - label: "Tarjetas de Eventos / Actividades"
                  name: "tarjetasEventos"
                  widget: "list"
                  fields:
                      - { label: "Título", name: "titulo", widget: "string" }
                      - {
                            label: "Fecha",
                            name: "fecha",
                            widget: "date",
                            format: "YYYY-MM-DD",
                        }
                      - label: "Ciudad"
                        name: "ciudad"
                        widget: "select"
                        options: ["La Paz", "El Alto", "Oruro", "Santa Cruz", "Sucre"]
                        default: "La Paz"
                      - {
                            label: "Descripción",
                            name: "descripcion",
                            widget: "text",
                        }
                      - {
                            label: "Imagen",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }
                      - {
                            label: "Color del Tema",
                            name: "colorTema",
                            widget: "string",
                            default: "#2C8E9E",
                            required: false,
                        }
                - label: "Eventos Calendario"
                  name: "eventosCalendario"
                  widget: "list"
                  fields:
                      - { label: "Nombre", name: "nombre", widget: "string" }
                      - {
                            label: "Fecha",
                            name: "fecha",
                            widget: "date",
                            format: "YYYY-MM-DD",
                        }
                      - {
                            label: "Color",
                            name: "color",
                            widget: "string",
                            default: "#2C8E9E",
                        }

    # =========================
    # LÍNEA DE AYUDA
    # =========================
    - name: "lineaAyuda"
      label: "Página de Línea de Ayuda"
      files:
          - label: "Contenido de Línea de Ayuda"
            name: "contenidoLineaAyuda"
            file: "src/data/lineaAyuda.json"
            fields:
                - label: "Carrusel"
                  name: "carrusel"
                  widget: "list"
                  fields:
                      - label: "Frase"
                        name: "frase"
                        widget: "string"
                      - label: "Imagen"
                        name: "imagen"
                        widget: "image"
                - label: "Contactos"
                  name: "contactos"
                  widget: "list"
                  fields:
                      - label: "Ciudad"
                        name: "ciudad"
                        widget: "string"
                      - label: "Número"
                        name: "numero"
                        widget: "string"
                - label: "Denuncias"
                  name: "denuncias"
                  widget: "list"
                  fields:
                      - label: "Título"
                        name: "titulo"
                        widget: "string"
                      - label: "Ley"
                        name: "ley"
                        widget: "string"
                      - label: "Descripción de la Ley"
                        name: "descripcion_ley"
                        widget: "text"
                      - label: "Imagen"
                        name: "imagen"
                        widget: "image"
                      - label: "Pasos"
                        name: "pasos"
                        widget: "list"
                        field:
                            label: "Paso"
                            name: "paso"
                            widget: "text"

    # =========================
    # CONTACTO
    # =========================
    - name: "contacto"
      label: "Página de Contacto"
      files:
          - label: "Contenido de Contacto"
            name: "contenidoContacto"
            file: "src/data/contacto.json"
            fields:
                - label: "Frases Hero"
                  name: "heroFrases"
                  widget: "list"
                  field: { label: "Frase", name: "frase", widget: "string" }
                - label: "Texto Barra Línea de Ayuda"
                  name: "lineaAyudaTexto"
                  widget: "string"
                - label: "Contacto General"
                  name: "contactoGeneral"
                  widget: "object"
                  fields:
                      - { label: "Título", name: "titulo", widget: "string" }
                      - {
                            label: "Mensaje Imagen",
                            name: "mensajeImagen",
                            widget: "string",
                        }
                      - {
                            label: "Imagen",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }
                - label: "Postulación de Profesionales"
                  name: "postulacion"
                  widget: "object"
                  fields:
                      - { label: "Título", name: "titulo", widget: "string" }
                      - {
                            label: "Subtítulo",
                            name: "subtitulo",
                            widget: "string",
                        }
                      - {
                            label: "Texto Descarga CV",
                            name: "textoDescarga",
                            widget: "string",
                        }
                      - {
                            label: "Imagen",
                            name: "imagen",
                            widget: "image",
                            required: false,
                        }
                - label: "Sedes"
                  name: "sedes"
                  widget: "list"
                  fields:
                      - {
                            label: "Nombre Sede",
                            name: "nombre",
                            widget: "string",
                        }
                      - {
                            label: "Teléfono",
                            name: "telefono",
                            widget: "string",
                        }
                      - { label: "Correo", name: "correo", widget: "string" }
                      - {
                            label: "Dirección",
                            name: "direccion",
                            widget: "string",
                        }
                      - { label: "Horario", name: "horario", widget: "string" }
                      - {
                            label: "Latitud",
                            name: "lat",
                            widget: "number",
                            value_type: "float",
                        }
                      - {
                            label: "Longitud",
                            name: "lng",
                            widget: "number",
                            value_type: "float",
                        }
                      - {
                            label: "Facebook URL",
                            name: "facebook",
                            widget: "string",
                            required: false,
                        }
                      - {
                            label: "Instagram URL",
                            name: "instagram",
                            widget: "string",
                            required: false,
                        }
                      - {
                            label: "TikTok URL",
                            name: "tiktok",
                            widget: "string",
                            required: false,
                        }
