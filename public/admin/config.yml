backend:
  name: github
  repo: lmujer-informatica/levantatemujer-web
  branch: main
  base_url: https://levantatemujer-web.vercel.app/admin
  auth_endpoint: /api/auth
  squash_merges: true
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'

media_folder: "public/uploads"
public_folder: "/uploads"

media_library:
  name: r2-media

collections:
  - name: "inicio"
    label: "Página de Inicio"
    files:
      - label: "Contenido de Inicio"
        name: "inicio"
        file: "src/data/inicio.json"
        fields:
          - label: "Hero Título"
            name: "heroTitulo"
            widget: "string"

          - label: "Hero Subtítulo"
            name: "heroSubtitulo"
            widget: "text"

          - label: "Hero Imágenes"
            name: "heroImagenes"
            widget: "list"
            field:
              label: "Imagen"
              name: "imagen"
              widget: "image"

          - label: "Nuestros Alcances (Estadísticas)"
            name: "estadisticas"
            widget: "list"
            fields:
              - label: "Valor"
                name: "valor"
                widget: "string"

              - label: "Etiqueta"
                name: "etiqueta"
                widget: "string"

          - label: "Programas Prioritarios"
            name: "programas"
            widget: "list"
            fields:
              - label: "Nombre"
                name: "nombre"
                widget: "string"

              - label: "Descripción"
                name: "descripcion"
                widget: "text"

              - label: "Imagen"
                name: "imagen"
                widget: "image"

          - label: "Línea de Ayuda - Título"
            name: "ayudaTitulo"
            widget: "string"

          - label: "Línea de Ayuda - Teléfono"
            name: "ayudaTelefono"
            widget: "string"

          - label: "Línea de Ayuda - Horario"
            name: "ayudaHorario"
            widget: "string"