        # =========================
        # DENUNCIAS
        # =========================
        - label: "Denuncias"
          name: "denuncias"
          widget: "list"
          fields:
            - label: "Título"
              name: "titulo"
              widget: "string"
            - label: "Ley"
              name: "ley"
              widget: "string"
            - label: "Descripción de la Ley"
              name: "descripcion_ley"
              widget: "text"
            - label: "Imagen"
              name: "imagen"
              widget: "image"
            - label: "Pasos"
              name: "pasos"
              widget: "list"
