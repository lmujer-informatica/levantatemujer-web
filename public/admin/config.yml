local_backend: true

backend:
  name: github
  repo: lmujer-informatica/levantatemujer-web
  branch: main
  base_url: https://levantatemujer-web.vercel.app
  auth_endpoint: /api/auth
  squash_merges: true
  publish_mode: editorial
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'

media_folder: "public/uploads"
public_folder: "/uploads"

media_library:
  name: r2-media

collections:
- name: "inicio"
  label: "Página de Inicio"
  files:
    - label: "Contenido de Inicio"
      name: "inicio"
      file: "src/data/inicio.json"
      fields:

        # =========================
        # HERO
        # =========================

        - label: "Hero - Frases"
          name: "heroFrases"
          widget: "list"
          field:
            label: "Frase"
            name: "frase"
            widget: "string"

        - label: "Hero - Subtítulo"
          name: "heroSubtitulo"
          widget: "text"

        - label: "Hero - Imágenes"
          name: "heroImagenes"
          widget: "list"
          field:
            label: "Imagen"
            name: "imagen"
            widget: "image"

        # =========================
        # ESTADÍSTICAS
        # =========================

        - label: "Nuestros Alcances"
          name: "estadisticas"
          widget: "list"
          fields:
            - label: "Valor"
              name: "valor"
              widget: "string"

            - label: "Etiqueta"
              name: "etiqueta"
              widget: "string"

        # =========================
        # PROGRAMAS PRIORITARIOS
        # =========================

        - label: "Programas Prioritarios"
          name: "programas"
          widget: "list"
          fields:
            - label: "Nombre"
              name: "nombre"
              widget: "string"

            - label: "Descripción"
              name: "descripcion"
              widget: "text"

            - label: "Imagen"
              name: "imagen"
              widget: "image"

        # =========================
        # LÍNEA DE AYUDA
        # =========================

        - label: "Línea de Ayuda"
          name: "lineaAyuda"
          widget: "object"
          fields:
            - label: "Mensaje"
              name: "mensaje"
              widget: "string"

            - label: "Imagen"
              name: "imagen"
              widget: "image"

        # =========================
        # INFORMACIÓN DE AYUDA
        # =========================

        - label: "Ayuda - Título"
          name: "ayudaTitulo"
          widget: "string"

        - label: "Ayuda - Teléfono"
          name: "ayudaTelefono"
          widget: "string"

        - label: "Ayuda - Horario"
          name: "ayudaHorario"
          widget: "string"


# =========================
# LÍNEA DE AYUDA
# =========================

- name: "lineaAyuda"
  label: "Página de Línea de Ayuda"
  files:
    - label: "Contenido de Línea de Ayuda"
      name: "contenidoLineaAyuda"
