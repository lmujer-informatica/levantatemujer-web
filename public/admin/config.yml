        # =========================
        # CARRUSEL
        # =========================
        - label: "Carrusel"
          name: "carrusel"
          widget: "list"
          fields:
            - label: "Frase"
              name: "frase"
              widget: "string"
            - label: "Imagen"
              name: "imagen"
              widget: "image"

        # =========================
        # CONTACTOS
        # =========================
        - label: "Contactos"
          name: "contactos"
          widget: "list"
          fields:
            - label: "Ciudad"
              name: "ciudad"
              widget: "string"
            - label: "Número"
              name: "numero"
